site_name: Manexp Web Lists Documentation
site_author: Edouard Brülhart

repo_name: edouardbruelhart/Manexp-Web-Lists
copyright: Maintained by <a
  href="https://github.com/edouardbruelhart">edouardbruelhart</a>.

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: ["manexp_web_lists"]
        import:
        - https://raw.githubusercontent.com/pyapp-kit/griffe-fieldz/main/README.md
        options:
          show_signature: true
          show_source: false
          docstring_style: google
          docstring_section_style: table
          members_order: source
          separate_signature: true
          show_signature_annotations: true
          show_docstring_parameters: true
          show_docstring_returns: true
          show_docstring_description: true
          show_model_fields: false
          merge_init_into_class: true
          show_if_no_docstring: false
          show_members: true
          filters: ["!^_"]
          show_root_heading: false
          line_length: 60
          show_docstring_attributes: true
          show_docstring_examples: true
          extensions:
          - griffe_fieldz

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: white
    accent: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - content.tabs.link
  - content.code.annotate
  - content.code.copy
  - announce.dismiss
  - navigation.tabs
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.preview
  - navigation.instant.progress
  - navigation.path
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.suggest
  - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
- Run: manexp_web_lists/run.md
- Pesticides:
  - Fetch pesticides: manexp_web_lists/pesticides/fetch_pesticides.md
- Taxa:
  - Fetch taxa: manexp_web_lists/taxa/fetch_taxa.md
  - Save taxa: manexp_web_lists/taxa/save_taxa.md
- Varieties_to_taxa:
  - Manual correction:
      manexp_web_lists/taxa/varieties_to_taxa/manual_correction.md
  - Varieties to taxa:
      manexp_web_lists/taxa/varieties_to_taxa/varieties_to_taxa.md
- Color_generator:
  - Color generator: manexp_web_lists/taxa/color_generator/color_generator.md
  - Text to color: manexp_web_lists/taxa/color_generator/text_to_color.md
- Models:
  - Crops: manexp_web_lists/taxa/models/crops.md
  - Taxa: manexp_web_lists/taxa/models/taxa.md
  - Taxonomy: manexp_web_lists/taxa/models/taxonomy.md
  - Translations: manexp_web_lists/taxa/models/translations.md
  - Varieties: manexp_web_lists/taxa/models/varieties.md
- Icon_generator:
  - Get unique families:
      manexp_web_lists/taxa/icon_generator/get_unique_families.md
  - Icon generator: manexp_web_lists/taxa/icon_generator/icon_generator.md
- Taxo_cleaner:
  - Clean taxonomy: manexp_web_lists/taxa/taxo_cleaner/clean_taxonomy.md
  - Resolve taxonomy: manexp_web_lists/taxa/taxo_cleaner/resolve_taxonomy.md
  - Taxo cleaner: manexp_web_lists/taxa/taxo_cleaner/taxo_cleaner.md
- Taxo_translator:
  - Gbif translation: manexp_web_lists/taxa/taxo_translator/gbif_translation.md
  - Google translation:
      manexp_web_lists/taxa/taxo_translator/google_translation.md
  - Models: manexp_web_lists/taxa/taxo_translator/models.md
  - Taxo translator: manexp_web_lists/taxa/taxo_translator/taxo_translator.md
  - Translate taxon: manexp_web_lists/taxa/taxo_translator/translate_taxon.md
  - Wikidata translation:
      manexp_web_lists/taxa/taxo_translator/wikidata_translation.md
- Requests:
  - Gbif requests: manexp_web_lists/requests/gbif_requests.md
  - Google requests: manexp_web_lists/requests/google_requests.md
  - Wikidata requests: manexp_web_lists/requests/wikidata_requests.md
- Exceptions:
  - Crop category mismatch:
      manexp_web_lists/exceptions/crop_category_mismatch.md
  - Families error: manexp_web_lists/exceptions/families_error.md
- Core:
  - Date parser: manexp_web_lists/core/date_parser.md
  - Json client: manexp_web_lists/core/json_client.md
  - Logging config: manexp_web_lists/core/logging_config.md
  - Mailer: manexp_web_lists/core/mailer.md
  - Strict model: manexp_web_lists/core/strict_model.md
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/edouardbruelhart/Manexp-Web-Lists
  - icon: fontawesome/solid/globe
    link: https://manexp.ch

markdown_extensions:
- tables
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.snippets
